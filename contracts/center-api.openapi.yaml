openapi: 3.1.0
info:
  title: Monitoring Agent API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /incidents:
    get:
      operationId: listIncidents
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, default: ACTIVE, enum: ['', ACTIVE, OPEN, ACKNOWLEDGED, IN_PROGRESS, RECOVERED, MONITORING_STOPPED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Project-scoped incident ledger, ordered by first detection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /incidents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getIncident
      responses:
        '200':
          description: Incident with latest 100 lifecycle events and eligible assignees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /incidents/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: actOnIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentAction' }
      responses:
        '200':
          description: Updated incident; recovery is controlled by observed health, not manual actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /incidents/{id}/evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getIncidentEvidence
      parameters:
        - { name: at, in: query, schema: { type: string, format: date-time }, description: Anchor time; defaults to first detection. Returns 15 minutes before and after. }
      responses:
        '200':
          description: Bounded stored evidence; logs require log access, configuration audit requires admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /xlog:
    get:
      operationId: getXlog
      parameters:
        - {name: project, in: query, schema: {type: string, default: ''}}
        - {name: instance, in: query, schema: {type: string, default: ''}}
        - {name: minutes, in: query, schema: {type: integer, minimum: 5, maximum: 1440, default: 60}}
        - {name: path, in: query, schema: {type: string, maxLength: 200, default: ''}}
        - {name: errorsOnly, in: query, schema: {type: boolean, default: false}}
        - {name: beforeId, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
      responses:
        '200':
          description: Retained collected requests in the permitted project scope, not total traffic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/XlogPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/xlog-settings:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getXlogSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XlogSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: saveXlogSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/XlogSettings' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XlogSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/instances/{instanceId}/connection:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: instanceId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getConnection
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: saveConnectionMode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportMode' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/instances/{instanceId}/connection/start:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: instanceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: startConnection
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/instances/{instanceId}/connection/stop:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: instanceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: stopConnection
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/instances/{instanceId}/events:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
      - { name: instanceId, in: path, required: true, schema: { type: string } }
      - { name: kind, in: query, schema: { type: string, enum: [XLOG, LOG], default: XLOG } }
      - { name: beforeId, in: query, schema: { type: integer, format: int64, default: 0 } }
    get:
      operationId: getCollectorEvents
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/roles:
    get:
      operationId: listRoles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ManagedRole' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '201':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/roles/{roleId}:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteRole
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/roles/{roleId}/users:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listRoleUsers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RoleUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      operationId: assignRoleUsers
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string } }
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/menus:
    get:
      operationId: listMenus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ManagedMenu' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/menus/{menuId}:
    parameters:
      - { name: menuId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuWrite' }
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /settings/permissions:
    get:
      operationId: listPermissions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MenuPermission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /settings/permissions/{role}:
    parameters:
      - { name: role, in: path, required: true, schema: { type: string, maxLength: 20 } }
    put:
      operationId: updatePermissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/PermissionWrite' } }
      responses:
        '204':
          description: Success
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /projects/{projectId}/instances/{instanceId}/logs:
    get:
      operationId: listLogs
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/InstanceId'}
      responses:
        '200':
          description: Configured log files (administrator or assigned operator only)
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LogSource'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createLog
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/InstanceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogWrite'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [log_id]
                properties:
                  log_id: {type: integer, format: int64}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/instances/{instanceId}/logs/{logId}:
    put:
      operationId: updateLog
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/InstanceId'}
        - {in: path, name: logId, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogWrite'}
      responses:
        '200': {description: Updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/instances/{instanceId}/logs/{logId}/read:
    get:
      operationId: readLog
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {$ref: '#/components/parameters/InstanceId'}
        - {in: path, name: logId, required: true, schema: {type: integer, format: int64}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 100}}
      responses:
        '200':
          description: Bounded raw text; on-demand shared polling, never persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogRead'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /session/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '302':
          description: Login succeeded and redirects to the SPA root
          headers:
            Location:
              required: true
              schema: {type: string, const: /}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /session/logout:
    post:
      operationId: logout
      responses:
        '204': {description: Logged out}
  /session/me:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionUser'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /settings/users:
    get:
      operationId: listUsers
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Administrator user list without credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserWrite'}
      responses:
        '201': {description: User created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settings/users/{username}:
    put:
      operationId: updateUser
      parameters:
        - name: username
          in: path
          required: true
          schema: {type: string, maxLength: 80}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserWrite'}
      responses:
        '204': {description: User updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settings/audit:
    get:
      operationId: listAudit
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - name: project
          in: query
          schema: {type: string}
        - name: actor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Configuration changes and request outcomes, without secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /dashboard:
    get:
      operationId: getDashboard
      parameters:
        - {name: project, in: query, schema: {type: string, default: ''}}
        - {name: instance, in: query, schema: {type: string, default: ''}}
        - {$ref: '#/components/parameters/Period'}
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects:
    get:
      operationId: listProjects
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/StatusFilter'}
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectWrite'}
      responses:
        '201': {description: Project created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    put:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectWrite'}
      responses:
        '200': {description: Project updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: disableProject
      responses:
        '204': {description: Project disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/permanent:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    delete:
      operationId: deleteProjectPermanently
      responses:
        '204': {description: Project and all dependent data permanently deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/instances:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listInstances
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/StatusFilter'}
      responses:
        '200':
          description: Instance page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstancePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createInstance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceWrite'}
      responses:
        '201': {description: Instance created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/instances/{instanceId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    put:
      operationId: updateInstance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceUpdate'}
      responses:
        '200': {description: Instance updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      operationId: disableInstance
      responses:
        '204': {description: Instance disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/instances/{instanceId}/permanent:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    delete:
      operationId: deleteInstancePermanently
      responses:
        '204': {description: Instance and all dependent data permanently deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/instances/{instanceId}/test:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    post:
      operationId: testInstance
      responses:
        '200':
          description: Connection result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/instances/{instanceId}/resources:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    get:
      operationId: getResources
      parameters:
        - {$ref: '#/components/parameters/Period'}
        - {$ref: '#/components/parameters/MaxPoints'}
      responses:
        '200':
          description: Resource latest and history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects/{projectId}/instances/{instanceId}/db-pools:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    get:
      operationId: getDbPools
      parameters:
        - {$ref: '#/components/parameters/Period'}
        - {$ref: '#/components/parameters/MaxPoints'}
      responses:
        '200':
          description: Pool latest and history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DbPoolResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects/{projectId}/instances/{instanceId}/internal-checks:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    get:
      operationId: listInternalChecks
      parameters:
        - {name: monitoringEnabled, in: query, schema: {type: boolean}, description: Filter used or unused checks.}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/StatusFilter'}
      responses:
        '200':
          description: Internal check page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api-checks:
    get:
      operationId: listApiChecks
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/StatusFilter'}
        - {name: project, in: query, schema: {$ref: '#/components/schemas/Identifier'}}
        - {name: instance, in: query, schema: {$ref: '#/components/schemas/Identifier'}}
        - {name: direction, in: query, schema: {type: string, enum: [INTERNAL, EXTERNAL]}}
        - {name: name, in: query, schema: {type: string, maxLength: 120}}
        - {name: monitoringEnabled, in: query, schema: {type: boolean}, description: Filter used or unused API checks. Omit to include both.}
      responses:
        '200':
          description: API check page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api-checks/{projectId}/{instanceId}/{checkId}/service:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
      - {$ref: '#/components/parameters/CheckId'}
    put:
      operationId: updateServiceProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceProfileWrite'}
      responses:
        '204': {description: Operator-owned service display profile saved; null disables display. Does not execute the API.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api-checks/{projectId}/{instanceId}/{checkId}/settings:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
      - {$ref: '#/components/parameters/CheckId'}
    put:
      operationId: updateCheckSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckSettingsWrite'}
      responses:
        '204': {description: Usage and automatic check schedule saved. Applies to API and INTERNAL checks.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api-checks/{projectId}/{instanceId}/{checkId}/usage:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
      - {$ref: '#/components/parameters/CheckId'}
    put:
      operationId: updateApiCheckUsage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '204': {description: Usage preference saved for an API or INTERNAL check. Unused checks are excluded from execution and operational status; history is retained.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api-checks/{projectId}/{instanceId}/{checkId}/run:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
      - {$ref: '#/components/parameters/CheckId'}
    post:
      operationId: runApiCheck
      responses:
        '202':
          description: Check accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionStatus'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /certificates:
    get:
      operationId: listCertificates
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {$ref: '#/components/parameters/Sort'}
        - {$ref: '#/components/parameters/StatusFilter'}
        - {name: project, in: query, schema: {$ref: '#/components/schemas/Identifier'}}
      responses:
        '200':
          description: Certificate page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificatePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateWrite'}
      responses:
        '201': {description: Certificate target created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /certificates/{id}:
    parameters:
      - {$ref: '#/components/parameters/CertificateId'}
    put:
      operationId: updateCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateWrite'}
      responses:
        '200': {description: Certificate target updated}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: disableCertificate
      responses:
        '204': {description: Certificate target disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /certificates/{id}/check:
    parameters:
      - {$ref: '#/components/parameters/CertificateId'}
    post:
      operationId: checkCertificate
      responses:
        '202':
          description: Certificate check accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /projects/{projectId}/instances/{instanceId}/thresholds:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    get:
      operationId: getInstanceThresholds
      responses:
        '200':
          description: Effective instance thresholds and responsible email addresses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceThresholdSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: saveInstanceThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstanceThresholdWrite'}
      responses:
        '200':
          description: Saved instance thresholds and responsible email addresses; does not send mail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceThresholdSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/instances/{instanceId}/thresholds/certificates:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/InstanceId'}
    get:
      operationId: getInstanceThresholdCertificates
      responses:
        '200':
          description: Available enabled certificate targets for this instance
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InstanceThresholdCertificate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /settings/thresholds:
    get:
      operationId: listThresholds
      responses:
        '200':
          description: Thresholds
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Threshold'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: updateThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {$ref: '#/components/schemas/Threshold'}}
      responses:
        '200':
          description: Updated thresholds
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Threshold'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: JSESSIONID}
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Size:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Sort:
      name: sort
      in: query
      description: Allowlisted field and direction, for example project_id,asc
      schema: {type: string}
    StatusFilter:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/Status'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CheckId:
      name: checkId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CertificateId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Period:
      name: period
      in: query
      schema: {type: string, enum: [5m, 15m, 1h, 24h, 7d, 30d, 365d], default: 24h}
    MaxPoints:
      name: max_points
      in: query
      schema: {type: integer, minimum: 1, maximum: 20000, default: 20000}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: CSRF token missing or access denied
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Check already running or rate limited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Incident:
      type: object
      additionalProperties: false
      required: [incident_id, project_id, project_name, instance_id, instance_name, kind, metric_key, subject_id, subject_name, severity, state, opened_at, last_detected_at, closed_at, assignee, version, first_observation, latest_observation]
      properties:
        incident_id: { type: integer, format: int64 }
        project_id: { type: string }
        project_name: { type: string }
        instance_id: { type: [string, 'null'] }
        instance_name: { type: [string, 'null'] }
        kind: { type: string, enum: [COLLECTION, METRIC, CHECK, CERTIFICATE] }
        metric_key: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        subject_name: { type: [string, 'null'] }
        severity: { type: string, enum: [WARN, DOWN] }
        state: { type: string, enum: [OPEN, ACKNOWLEDGED, IN_PROGRESS, RECOVERED, MONITORING_STOPPED] }
        opened_at: { type: string, format: date-time }
        last_detected_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        assignee: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
        first_observation: { $ref: '#/components/schemas/DashboardStatusCause' }
        latest_observation: { $ref: '#/components/schemas/DashboardStatusCause' }
    IncidentPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    IncidentDetail:
      type: object
      required: [incident, events, assignees]
      properties:
        incident: { $ref: '#/components/schemas/Incident' }
        events: { type: array, items: { $ref: '#/components/schemas/IncidentEvent' } }
        assignees: { type: array, items: { type: string } }
    IncidentEvent:
      type: object
      required: [event_id, occurred_at, actor, event_type, note, assignee]
      properties:
        event_id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        event_type: { type: string }
        note: { type: [string, 'null'] }
        assignee: { type: [string, 'null'] }
    IncidentAction:
      type: object
      additionalProperties: false
      required: [version, action]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        action: { type: string, enum: [ACKNOWLEDGE, START, ASSIGN, COMMENT] }
        assignee: { type: [string, 'null'] }
        note: { type: [string, 'null'], maxLength: 2000 }
    IncidentEvidence:
      type: object
      required: [from, to, logs_allowed, changes_allowed, resources, checks, logs, changes]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        logs_allowed: { type: boolean }
        changes_allowed: { type: boolean }
        resources: { type: array, items: { $ref: '#/components/schemas/IncidentResource' } }
        checks: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/IncidentCheck' } }
        logs: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/IncidentLog' } }
        changes: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/IncidentChange' } }
    IncidentResource:
      type: object
      required: [sampled_at, system_cpu_ratio, heap_ratio, memory_ratio, disk_ratio, db_pool_ratio]
      properties:
        sampled_at: { type: string, format: date-time }
        system_cpu_ratio: { type: [number, 'null'] }
        heap_ratio: { type: [number, 'null'] }
        memory_ratio: { type: [number, 'null'] }
        disk_ratio: { type: [number, 'null'] }
        db_pool_ratio: { type: [number, 'null'] }
    IncidentCheck:
      type: object
      required: [instance_id, check_id, name, category, checked_at, central_received_at, status, duration_ms, result_code]
      properties:
        instance_id: { type: string }
        check_id: { type: string }
        name: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        checked_at: { type: [string, 'null'], format: date-time }
        central_received_at: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/Status' }
        duration_ms: { type: [number, 'null'] }
        result_code: { type: [string, 'null'] }
    IncidentLog:
      type: object
      required: [id, received_at, text]
      properties:
        id: { type: integer, format: int64 }
        received_at: { type: string, format: date-time }
        text: { type: [string, 'null'], maxLength: 8192 }
    IncidentChange:
      type: object
      required: [audit_id, occurred_at, actor, action, entity_type, target_id]
      properties:
        audit_id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        entity_type: { type: string }
        target_id: { type: string }
    XlogSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    TransportMode:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [HTTP, WSS] }
    ConnectionState:
      type: object
      required: [state]
      properties:
        state: { type: string }
        mode: { type: string, enum: [HTTP, WSS] }
        xlog_enabled: { type: boolean }
        reason: { type: string }
        dropped: { type: integer, format: int64 }
        last_received_at: { type: string }
    XlogPage:
      type: object
      required: [items, summary, enabled_projects, eligible_instances, connected_instances]
      properties:
        enabled_projects: {type: integer}
        eligible_instances: {type: integer}
        connected_instances: {type: integer}
        summary:
          type: object
          required: [count, errors, average_ms, p95_ms]
          properties:
            count: {type: integer}
            errors: {type: integer}
            average_ms: {type: number}
            p95_ms: {type: number}
        items:
          type: array
          items:
            type: object
            required: [id, project_id, instance_id, project_name, instance_name, received_at, payload]
            properties:
              id: {type: integer, format: int64}
              project_id: {type: string}
              instance_id: {type: string}
              project_name: {type: string}
              instance_name: {type: string}
              received_at: {type: string}
              payload:
                type: object
                required: [started_at, duration_ms, method, path, status]
                properties:
                  started_at: {type: integer, format: int64}
                  duration_ms: {type: integer, format: int64}
                  method: {type: string}
                  path: {type: string}
                  status: {type: integer}
    CollectorEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, received_at, payload]
            properties:
              id: { type: integer, format: int64 }
              received_at: { type: string }
              payload:
                type: object
                properties:
                  started_at: { type: integer, format: int64 }
                  duration_ms: { type: integer, format: int64 }
                  method: { type: string }
                  path: { type: string }
                  status: { type: integer }
                  text: { type: string }
    LogWrite:
      type: object
      additionalProperties: false
      required: [name, path, encoding, enabled, pollIntervalSeconds]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        path: {type: string, minLength: 1, maxLength: 1000}
        encoding: {type: string, enum: [UTF-8, MS949, EUC-KR]}
        enabled: {type: boolean}
        pollIntervalSeconds: {type: integer, minimum: 5, maximum: 1800, default: 10}
    LogSource:
      type: object
      required: [log_id, name, path, encoding, enabled, poll_interval_seconds]
      properties:
        log_id: {type: integer, format: int64}
        name: {type: string}
        path: {type: string}
        encoding: {type: string, enum: [UTF-8, MS949, EUC-KR]}
        enabled: {type: boolean}
        poll_interval_seconds: {type: integer}
    LogRead:
      type: object
      required: [text, cursor, reset, limited, code, retry_after_seconds]
      properties:
        text: {type: string, maxLength: 131072}
        cursor: {type: string}
        reset: {type: boolean}
        limited: {type: boolean}
        code: {type: [string, 'null']}
        retry_after_seconds: {type: integer}
    Identifier:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
    Status:
      type: string
      enum: [UP, WARN, DOWN, UNKNOWN]
    PageMetadata:
      type: object
      required: [page, size, total]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 200}
        total: {type: integer, format: int64, minimum: 0}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}
    ManagedMenu:
      type: object
      required: [menuId, label, route, sortOrder, enabled, canRead, canWrite]
      properties:
        menuId: { type: string }
        label: { type: string }
        route: { type: string }
        sortOrder: { type: integer }
        enabled: { type: boolean }
        canRead: { type: boolean }
        canWrite: { type: boolean }
    MenuWrite:
      type: object
      required: [label, sortOrder, enabled]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        sortOrder: { type: integer, minimum: 0, maximum: 999 }
        enabled: { type: boolean }
    PermissionWrite:
      type: object
      required: [menuId, canRead, canWrite]
      properties:
        menuId: { type: string }
        canRead: { type: boolean }
        canWrite: { type: boolean }
    MenuPermission:
      allOf:
        - { $ref: '#/components/schemas/PermissionWrite' }
        - type: object
          required: [role, label]
          properties:
            role: { type: string, maxLength: 20 }
            label: { type: string }
    RoleWrite:
      type: object
      required: [roleId, name, description, baseRole, enabled]
      properties:
        roleId: {type: string, pattern: "^[A-Z][A-Z0-9_]{1,19}$"}
        name: {type: string, minLength: 1, maxLength: 60}
        description: {type: string, maxLength: 500}
        baseRole: {type: string, enum: [ADMIN, OPERATOR, VIEWER]}
        enabled: {type: boolean}
    ManagedRole:
      allOf:
        - {$ref: "#/components/schemas/RoleWrite"}
        - type: object
          required: [builtin, userCount]
          properties:
            builtin: {type: boolean}
            userCount: {type: integer, minimum: 0}
    RoleUser:
      type: object
      required: [username, role, enabled, assigned]
      properties:
        username: {type: string}
        role: {type: string}
        enabled: {type: boolean}
        assigned: {type: boolean}
    SessionUser:
      type: object
      required: [username, role]
      properties:
        menus: { type: array, items: { $ref: '#/components/schemas/ManagedMenu' } }
        username: {type: string}
        role_id: {type: string}
        role_name: {type: string}
        role: {type: string, enum: [ADMIN, OPERATOR, VIEWER]}
        project_ids: {type: array, items: {type: string}}
    ManagedUser:
      type: object
      required: [username, role, enabled, project_ids, created_at, updated_at]
      properties:
        username: {type: string}
        role: {type: string, maxLength: 20}
        role_name: {type: string}
        enabled: {type: boolean}
        project_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UserWrite:
      type: object
      required: [username, role, enabled, projectIds]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{1,79}$'}
        password: {type: string, format: password, writeOnly: true, description: Required on creation; blank on update preserves existing password. Supplied passwords need at least 12 characters and at most 72 UTF-8 bytes.}
