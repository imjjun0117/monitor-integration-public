        message: {type: [string, 'null']}
        checked_at: {type: [string, 'null'], format: date-time}
        enabled: {type: boolean}
    CertificateWrite:
      type: object
      required: [projectId, hostname, port, sniHostname, enabled, checkIntervalMinutes]
      properties:
        projectId: {$ref: '#/components/schemas/Identifier'}
        hostname: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        sniHostname: {type: string, minLength: 1, maxLength: 253}
        enabled: {type: boolean}
        checkIntervalMinutes: {type: integer, minimum: 1, default: 360}
    CertificatePage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Certificate'}}
    Threshold:
      type: object
      required: [scope, projectId, instanceId, metricKey, warningValue, criticalValue]
      properties:
        scope: {type: string, enum: [GLOBAL, PROJECT, INSTANCE]}
        projectId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
        instanceId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
        metricKey: {type: string, enum: [SYSTEM_CPU, PHYSICAL_MEMORY, JVM_HEAP, DISK,
          DB_POOL, API_LATENCY_MS, CERTIFICATE_DAYS]}
        warningValue: {type: number, minimum: 0}
        criticalValue: {type: number, minimum: 0}
