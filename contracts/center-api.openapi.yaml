        enabled: {type: boolean}
    CertificateWrite:
      type: object
      required: [projectId, hostname, port, sniHostname, enabled, checkIntervalMinutes]
      properties:
        projectId: {$ref: '#/components/schemas/Identifier'}
        hostname: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        sniHostname: {type: string, minLength: 1, maxLength: 253}
        enabled: {type: boolean}
        checkIntervalMinutes: {type: integer, minimum: 1, default: 360}
    CertificatePage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Certificate'}}
    Threshold:
      type: object
      required: [scope, projectId, instanceId, metricKey, warningValue, criticalValue]
      properties:
        scope: {type: string, enum: [GLOBAL, PROJECT, INSTANCE]}
        projectId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
        instanceId: {oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]}
        metricKey: {type: string, enum: [SYSTEM_CPU, PHYSICAL_MEMORY, JVM_HEAP, DISK,
          DB_POOL, API_LATENCY_MS, CERTIFICATE_DAYS]}
        warningValue: {type: number, minimum: 0}
        criticalValue: {type: number, minimum: 0}

    RecipientEmails:
      type: array
      maxItems: 10
      items: {type: string, format: email, maxLength: 254}
    InstanceThresholdMetricKey:
      type: string
      enum: [SYSTEM_CPU, PHYSICAL_MEMORY, JVM_HEAP, DISK, DB_POOL, API_LATENCY_MS, CERTIFICATE_DAYS]
    InstanceThresholdMetric:
      type: object
      required: [metricKey, warningValue, criticalValue, defaultWarningValue, defaultCriticalValue, useDefault, recipientEmails]
      properties:
        metricKey: {$ref: '#/components/schemas/InstanceThresholdMetricKey'}
        warningValue: {type: number, minimum: 0}
        criticalValue: {type: number, minimum: 0}
        defaultWarningValue: {type: number, minimum: 0}
        defaultCriticalValue: {type: number, minimum: 0}
        useDefault: {type: boolean}
        recipientEmails: {$ref: '#/components/schemas/RecipientEmails'}
        certificateTargetId: {type: [integer, 'null'], format: int64}
        certificateTargetLabel: {type: [string, 'null']}
    InstanceThresholdSettings:
      type: object
      required: [projectName, instanceName, recipientEmails, metrics]
      properties:
        projectName: {type: string}
        instanceName: {type: string}
        recipientEmails: {$ref: '#/components/schemas/RecipientEmails'}
        metrics: {type: array, minItems: 0, maxItems: 7, items: {$ref: '#/components/schemas/InstanceThresholdMetric'}}
    InstanceThresholdWrite:
      type: object
      required: [recipientEmails, metrics]
      properties:
        recipientEmails: {$ref: '#/components/schemas/RecipientEmails'}
        metrics:
          type: array
          minItems: 0
          maxItems: 7
          items:
            type: object
            required: [metricKey, warningValue, criticalValue, useDefault, recipientEmails]
            properties:
              metricKey: {$ref: '#/components/schemas/InstanceThresholdMetricKey'}
              warningValue: {type: number, minimum: 0}
              criticalValue: {type: number, minimum: 0}
              useDefault: {type: boolean}
              recipientEmails: {$ref: '#/components/schemas/RecipientEmails'}
              certificateTargetId: {type: [integer, 'null'], format: int64}
    InstanceThresholdCertificate:
      type: object
      required: [id, label]
      properties:
        id: {type: integer, format: int64}
        label: {type: string}
